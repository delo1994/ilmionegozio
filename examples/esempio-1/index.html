<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esempio 1 - Landing Lead Generation</title>
  <meta name="description" content="Esempio di landing page per lead generation con struttura marketing professionale.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #fff; background: #06111f url('/static/background.webp') center/cover fixed; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,0.42); }
    .demo { width: min(980px, 100%); border: 1px solid rgba(255,255,255,0.28); background: rgba(0,0,0,0.72); padding: 28px; border-radius: 6px; box-shadow: 0 0 30px rgba(0,255,255,0.18); }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 4.5rem); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px; }
    .metric { padding: 18px; border: 1px solid rgba(0,255,255,0.38); background: rgba(0,64,128,0.22); }
    a { color: #9ff; font-weight: 700; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="demo">
      <h1>Landing Lead Generation</h1>
      <p>Struttura pensata per trasformare traffico Ads in richieste preventivo: headline chiara, prova sociale, offerta e CTA diretta.</p>
      <div class="grid">
        <div class="metric"><strong>Obiettivo</strong><br>Contatto qualificato</div>
        <div class="metric"><strong>Canale</strong><br>Google Ads Search</div>
        <div class="metric"><strong>KPI</strong><br>Costo per lead</div>
      </div>
      <p><a href="/face5">Torna al report</a></p>
    </section>
  </main>
</body>
</html>
