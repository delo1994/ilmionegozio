<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionale e Appuntamenti - ilmionegozio.com</title>
  <meta name="description" content="Modulo appuntamenti e gestionale del sito originale, preparato per endpoint Vercel.">
  <style>
    /* Stile per contenuti nascosti ma accessibili agli screen reader */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    /* Skip link: visibile al focus */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #007bff;
      color: #fff;
      padding: 8px;
      z-index: 100;
      text-decoration: none;
      transition: top 0.3s;
    }
    .skip-link:focus {
      top: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 20px;
      padding-bottom: 120px; /* spazio per footer fisso */
    }
    .container {
      max-width: 500px;
      background: #fff;
      padding: 20px;
      margin: 0 auto;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }
    form { display: flex; flex-direction: column; }
    input, select, button { padding: 10px; margin: 10px 0; font-size: 1rem; }
    button { background: #007bff; color: #fff; border: none; cursor: pointer; border-radius: 3px; }
    button:hover { background: #0056b3; }
    .footer {
      text-align: center;
      padding: 15px;
      background-color: #f0f0f0;
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      font-size: 0.85rem;
      color: #555;
      border-top: 1px solid #ddd;
    }
    .footer a { color: #007bff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  
    *, *::before, *::after { box-sizing: border-box; }
    html, body { max-width: 100%; }
    body > canvas { max-width: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gestionale e Appuntamenti - ilmionegozio.com">
  <meta property="og:description" content="Modulo appuntamenti e gestionale del sito originale, preparato per endpoint Vercel.">
  <meta property="og:url" content="https://www.ilmionegozio.com/">
  <meta property="og:image" content="https://www.ilmionegozio.com/static/background.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gestionale e Appuntamenti - ilmionegozio.com">
  <meta name="twitter:description" content="Modulo appuntamenti e gestionale del sito originale, preparato per endpoint Vercel.">
  <meta name="twitter:image" content="https://www.ilmionegozio.com/static/background.webp">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Skip link per saltare al contenuto principale -->
  <a href="#main-content" class="skip-link">Salta al contenuto</a>

  <!-- Contenuto principale -->
  <main id="main-content" role="main">
    <div class="container">
      <h1>Prenota un Appuntamento</h1>
      <form id="appointmentForm">
        <!-- Etichette nascoste per accessibilità -->
        <label for="nome" class="sr-only">Nome</label>
        <input type="text" id="nome" placeholder="Nome" required aria-required="true">
        
        <label for="email" class="sr-only">Email</label>
        <input type="email" id="email" placeholder="Email" required aria-required="true">
        
        <label for="telefono" class="sr-only">Telefono</label>
        <input type="tel" id="telefono" placeholder="Telefono" required aria-required="true">
        
        <label for="dataAppuntamento">Data Appuntamento</label>
        <input type="date" id="dataAppuntamento" required aria-required="true">
        
        <label for="slotAppuntamento">Slot Appuntamento</label>
        <select id="slotAppuntamento" required aria-required="true">
          <option value="">-- Seleziona --</option>
          <option value="Mattina">Mattina</option>
          <option value="Pomeriggio">Pomeriggio</option>
        </select>
        
        <label for="argomento">Scegli l'argomento:</label>
        <select id="argomento" required aria-required="true">
          <option value="">-- Seleziona --</option>
          <option value="Ambienti 3D">Ambienti 3D (Faccia 1)</option>
          <option value="Montaggio Video">Montaggio Video (Faccia 2)</option>
          <option value="Gestionale">Gestionale (Faccia 3)</option>
          <option value="Apps&Giochi">Apps&Giochi (Faccia 4)</option>
          <option value="Analisi Di Mercato">Analisi di Mercato (Faccia 5)</option>
          <option value="Real to 3D Experience">Real to 3D Experience (Faccia 6)</option>
        </select>
        <button type="submit">Prenota Appuntamento</button>
      </form>
      <div style="text-align: center; margin-top: 20px;">
        <button onclick="goToMenu()" style="padding: 10px 20px; font-size: 1rem; background: #007bff; color: #fff; border: none; border-radius: 5px; cursor: pointer;" aria-label="Torna al Cubo Interattivo">Torna al cubo interattivo</button>
      </div>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <strong>Emanuele Delogu</strong> – Partita IVA: <strong>02300160518</strong> – San Zeno 22/B, Arezzo<br>
    <a href="/privacy-policy" target="_blank">Privacy Policy</a> | 
    <a href="/cookie-policy" target="_blank">Cookie Policy</a> | 
    <a href="/Accessibilita" target="_blank">Accessibilità</a> | 
    <a href="/Termini_Condizioni" target="_blank">Termini&Condizioni</a>
  </footer>

  <script>
    function goToMenu() { window.location.href = "/"; }

    document.getElementById('appointmentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const appointmentData = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        data: document.getElementById('dataAppuntamento').value,
        slot: document.getElementById('slotAppuntamento').value,
        argomento: document.getElementById('argomento').value
      };
      fetch('/book_appointment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(appointmentData)
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === 'success'){
          if (data.whatsappUrl) {
            window.open(data.whatsappUrl, '_blank', 'noopener');
            alert('Prenotazione pronta: completa l\'invio su WhatsApp.');
          } else {
            alert('Prenotazione inviata con successo!');
          }
          document.getElementById('appointmentForm').reset();
        } else { 
          alert('Errore: ' + data.error); 
        }
      })
      .catch(err => { 
        console.error('Errore:', err); 
        alert('Si è verificato un errore.');
      });
    });

    // Esempio di setup Three.js per la parte interattiva (opzionale)
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera3D.position.set(0, 0, 5);
    scene.add(camera3D);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Il canvas viene considerato decorativo e ignorato dagli screen reader
    renderer.domElement.setAttribute("aria-hidden", "true");
    document.body.appendChild(renderer.domElement);
    const legendGroup = new THREE.Group();
    legendGroup.renderOrder = 999;
    if (window.matchMedia("(max-width: 600px)").matches) {
      camera3D.add(legendGroup);
      legendGroup.position.set(-0.43, 1, -2);
      legendGroup.scale.set(6, 6, 6);
    } else {
      legendGroup.position.set(8, 4, -3);
      legendGroup.scale.set(5, 5, 5);
      scene.add(legendGroup);
    }
    function animate() { 
      requestAnimationFrame(animate); 
      renderer.render(scene, camera3D); 
    }
    animate();
  </script>
</body>
</html>
